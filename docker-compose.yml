services:
  mysql-usuarios:
    image: mysql:8.0
    container_name: mysql_usuarios
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: levelup_usuarios
    ports:
      - "3309:3306"
    volumes:
      - mysql_usuarios_data:/var/lib/mysql

  mysql-productos:
    image: mysql:8.0
    container_name: mysql_productos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: levelup_productos
    ports:
      - "3307:3306"
    volumes:
      - mysql_productos_data:/var/lib/mysql

  mysql-ventas:
    image: mysql:8.0
    container_name: mysql_ventas
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: levelup_ventas
    ports:
      - "3308:3306"
    volumes:
      - mysql_ventas_data:/var/lib/mysql

volumes:
  mysql_usuarios_data:
  mysql_productos_data:
  mysql_ventas_data: