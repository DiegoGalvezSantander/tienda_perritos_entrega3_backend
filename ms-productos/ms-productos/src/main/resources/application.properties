spring.application.name=ms-productos
server.port=8082

# Base de datos MySQL (contenedor mysql_productos en puerto 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/levelup_productos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT (debe coincidir con la clave usada por ms-usuarios)
jwt.secret=LevelUpSecretKeySuperSecretaParaFirmarTokensJWT2026Empresa