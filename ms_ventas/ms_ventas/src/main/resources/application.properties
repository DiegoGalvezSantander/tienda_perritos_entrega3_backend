spring.application.name=ms-ventas
server.port=8083

# Base de datos MySQL (contenedor mysql_ventas en puerto 3308)
spring.datasource.url=jdbc:mysql://localhost:3308/levelup_ventas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT
jwt.secret=LevelUpSecretKeySuperSecretaParaFirmarTokensJWT2026Empresa

# URL de comunicación hacia ms-productos
ms.productos.url=http://localhost:8082