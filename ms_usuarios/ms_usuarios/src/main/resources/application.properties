spring.application.name=ms-usuarios
server.port=8081

# Base de datos MySQL (mysql_usuarios en puerto 3309 -> base levelup_usuarios)[cite: 2]
spring.datasource.url=jdbc:mysql://localhost:3309/levelup_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración JWT
jwt.secret=LevelUpSecretKeySuperSecretaParaFirmarTokensJWT2026Empresa
jwt.access.expiration=86400000
jwt.refresh.expiration=604800000